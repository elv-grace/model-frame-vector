# GPU is auto-detected at runtime (torch.cuda.is_available); advisory only, matching the
# other model-* taggers.
device: cuda

model:
  # Detector weights are NOT listed here, and none load unless a request sets `detect_target`.
  # Which one then loads depends on the request: `detect_target` routes terms to a backend and
  # `brand_detector` picks between the two open-vocabulary options. The checkpoints and their
  # measured input sizes and thresholds live in general_detection/detector.py (BRAND_BACKENDS,
  # PERSON_BACKEND) so that a weight, its resolution and its threshold stay together -- they
  # were measured together and are not independently valid.
  #
  #   brand, "coverage" (default)  grounding-dino-base   @800,  conf 0.07
  #   brand, "fast"                yoloe-26l-seg.pt      @1280, conf 0.007
  #   person                       yolo11l.pt            @640,  conf 0.11
  #
  # All are downloaded on first load into storage.cache_path (ultralytics) or the HF cache.
  #
  # A fourth model loads only when the request sets `ocr`: easyocr's CRAFT text detector and
  # CRNN recogniser, into storage.cache_path/easyocr. Off by default -- see the OCR section of
  # the README and general_detection/ocr.py.

  embedder:
    # SigLIP 2 NaFlex image tower, pulled from the HuggingFace hub on first load into the
    # container's HF cache (HF_HOME, see the Containerfile). Embeds whole frames by default and
    # detected crops when a target is set -- one checkpoint either way, so the two modes stay
    # in the same 768-d space.
    model_id: google/siglip2-base-patch16-naflex
    # Pinned rather than null so the vectors are reproducible and byte-comparable with what
    # model-siglip2-frame-vector already indexed at this commit. Threaded into from_pretrained
    # for both the model and the processor; ignored when model_id is a local path.
    revision: b53b807d3a2d5e2b3911292f2d69e5341cdc064c

storage:
  # Persistent cache for the YOLOE checkpoint, the MobileCLIP text encoder that get_text_pe()
  # downloads, and easyocr's weights. Must be a mounted volume or they are re-fetched every run.
  cache_path: /root/.cache/detection

# Runtime tunables (the `detect_target` mode switch, thresholds, crop and embedding knobs) live
# in general_detection/config.py's RuntimeConfig and are injected per-request via `--params`; see
# the README's "Runtime parameters" table. Frame sampling rate (fps) is handled generically by
# the tagger runtime.
